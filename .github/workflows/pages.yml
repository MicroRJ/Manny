name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "site/**"
      - "build.elf"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build website
        run: .\blessed\manny.exe build.elf site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
