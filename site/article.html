<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	$if(description)$<meta name="description" content="$description$">$endif$
	<meta property="og:title" content="$title$">
	$if(description)$<meta property="og:description" content="$description$">$endif$
	<meta property="og:type" content="article">
	<title>$title$ — Manny</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<nav aria-label="Project links">
			<a href="index.html">Home</a>
			<a href="index.html#guide">Guide</a>
			<a href="https://github.com/MicroRJ/Manny">GitHub</a>
		</nav>
	</header>

	<main class="article">
		$if(label)$<p class="article-label">$label$</p>$endif$
		<h1>$title$</h1>
		$body$
	</main>

	<footer>
		<p>Manny lives <a href="https://github.com/MicroRJ/Manny">on GitHub</a>.</p>
		<p>0.3.0-dev</p>

</html>
